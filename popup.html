<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>M-Pesa Code Extractor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="mark">M</div>
    <div class="header-text">
      <h1>M-Pesa Code Extractor</h1>
      <p>Paste a payment screenshot, get the codes.</p>
    </div>
  </header>

  <main>
    <div id="dropzone" class="dropzone" tabindex="0">
      <div id="dz-empty" class="dz-empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M3 15l4.5-4.5a2 2 0 0 1 2.8 0L15 15"/>
          <path d="M13.5 13.5L15.5 11.5a2 2 0 0 1 2.8 0L21 14"/>
          <circle cx="8" cy="8" r="1.4"/>
        </svg>
        <p><strong>Ctrl+V</strong> to paste a screenshot</p>
        <p class="dz-sub">click here first, then paste</p>
      </div>
      <img id="dz-preview" class="dz-preview" alt="Pasted screenshot preview" hidden>
    </div>

    <button id="clear-btn" class="text-btn" hidden>Clear &amp; paste another</button>

    <div id="status" class="status" hidden></div>

    <section id="results" class="results" hidden>
      <div class="result-row">
        <div class="result-label">M-Pesa Code</div>
        <div class="result-value-row">
          <span id="mpesa-value" class="result-value">—</span>
          <button id="copy-mpesa" class="copy-btn" disabled>Copy</button>
        </div>
      </div>
      <div class="result-row">
        <div class="result-label">Invoice / Account No.</div>
        <div class="result-value-row">
          <span id="invoice-value" class="result-value">—</span>
          <button id="copy-invoice" class="copy-btn" disabled>Copy</button>
        </div>
      </div>
    </section>

    <details id="raw-details" class="raw-details" hidden>
      <summary>Didn't look right? See extracted text</summary>
      <pre id="raw-text"></pre>
    </details>
  </main>

  <footer class="app-footer">Runs locally in your browser — screenshots are never uploaded.</footer>

  <iframe id="ocr-sandbox" src="sandbox.html" sandbox="allow-scripts" hidden></iframe>

  <script src="popup.js"></script>
</body>
</html>
